<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ali İslam Dinç | Data Analytics Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;

background:#07111f;

color:white;

overflow-x:hidden;

}

.hero{

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:40px;

background:
radial-gradient(circle at top,#1d4ed8 0%,#07111f 60%);

}

h1{

font-size:70px;

font-weight:700;

margin-bottom:15px;

letter-spacing:2px;

}

h2{

font-size:28px;

font-weight:300;

color:#9ec5ff;

margin-bottom:25px;

}

p{

max-width:700px;

font-size:18px;

line-height:1.8;

color:#d6d6d6;

margin-bottom:45px;

}

.buttons{

display:flex;

gap:20px;

flex-wrap:wrap;

justify-content:center;

}

.btn{

padding:18px 40px;

border-radius:50px;

text-decoration:none;

font-weight:600;

transition:.35s;

}

.primary{

background:#2563eb;

color:white;

}

.primary:hover{

background:#3b82f6;

transform:translateY(-4px);

}

.secondary{

border:2px solid white;

color:white;

}

.secondary:hover{

background:white;

color:#07111f;

transform:translateY(-4px);

}

.scroll{

margin-top:80px;

font-size:14px;

opacity:.6;

animation:updown 1.8s infinite;

}

@keyframes updown{

0%{transform:translateY(0);}
50%{transform:translateY(12px);}
100%{transform:translateY(0);}

}

</style>

</head>

<body>

<section class="hero">

<h1>Ali İslam Dinç</h1>

<h2>Data Analyst • Excel • SQL • Power BI • AI</h2>

<p>

Veriyi anlamlı bilgiye dönüştürmeyi hedefleyen,
lojistik operasyon deneyimini veri analitiği ile
birleştiren ve karar süreçlerine değer katmayı
amaçlayan bir veri analisti adayı.

</p>

<div class="buttons">

<a href="#" class="btn primary">

Projelerim

</a>

<a href="#" class="btn secondary">

CV İndir

</a>

</div>

<div class="scroll">

▼ Aşağı Kaydır ▼

</div>

</section>

</body>

</html>
